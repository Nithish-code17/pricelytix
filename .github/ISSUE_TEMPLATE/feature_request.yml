name: Feature request
description: Suggest a useful improvement to Pricelytix
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for similar requests.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without relying only on implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who benefits, how often, and how would success be measured?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, dependencies, or compatibility considerations.
